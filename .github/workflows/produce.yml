name: produce

# The bot's one daily run, at 06:15 Nairobi:
# - every day: the storage rules and checks (what you posted or discarded, whether scheduled videos went
#   public, deleting stored copies that are due), the status file for the control panel, and deleting old
#   caches and run logs. About 1 to 2 minutes.
# - on video days (channel.toml [schedule] make_days; Mondays and Thursdays by default), or whenever you
#   press Run workflow: it also makes the next video (next chapter, script by free models, George's
#   narration, matched pictures, render), stores it as a GitHub release and delivers it (channel.toml
#   [schedule] mode). About 1 to 2 hours. It first checks the bot's monthly minutes ([actions]).
# If anything fails, it opens a "The bot needs attention" issue. How it all works: docs/HOW-IT-WORKS.md.
on:
  schedule:
    - cron: "15 3 * * *"   # 03:15 UTC = 06:15 Nairobi, every day. Video days are chosen in channel.toml.
  workflow_dispatch:
    inputs:
      angle:
        description: "Optional: an idea or angle for this one video"
        required: false

permissions:
  contents: write   # commit state and storyboards back; create releases (stored copies)
  issues: write     # tell you about videos and anything the bot needs
  actions: write    # count this repository's Actions minutes; delete old caches and run logs

concurrency:
  group: bot-state  # never two runs at once (they both update state/videos.json)
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      OWD_CACHE_DIR: ${{ github.workspace }}/.owd-cache
      GITHUB_TOKEN: ${{ github.token }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - run: uv sync --frozen

      - name: Is today a video day?
        id: plan
        run: uv run --frozen python -m owd plan

      - name: Check the keys are set
        env:
          MAKE: ${{ steps.plan.outputs.make }}
        run: |
          # Names only: GitHub never shows a secret's value, and neither does this step.
          {
            echo "### Secrets this run can see"
            for name in PIXABAY_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_AI_TOKEN \
                        YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
              if [ -n "${!name}" ]; then echo "- $name: set"; else echo "- $name: not set"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_AI_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_AI_TOKEN isn't set, so there are no paintings: scenes no clip fits use the closest clip."
          fi
          missing=""
          for name in PIXABAY_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ] && [ "$MAKE" = "true" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

      - name: Daily checks and clean-up (storage rules)
        run: uv run --frozen python -m owd cleanup

      - name: ffmpeg (with libass for captions)
        if: steps.plan.outputs.make == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Model cache
        if: steps.plan.outputs.make == 'true'
        uses: actions/cache@v4
        with:
          path: .hf
          key: models-${{ hashFiles('owd/models.py') }}

      - name: Footage, painting and news cache
        if: steps.plan.outputs.make == 'true'
        uses: actions/cache@v4
        with:
          path: .owd-cache
          key: owd-cache-${{ github.run_id }}
          restore-keys: owd-cache-

      - name: Pinned voice and speech-check models
        if: steps.plan.outputs.make == 'true'
        run: uv run --frozen python -m owd fetch-models

      - name: Make and deliver the next video
        if: steps.plan.outputs.make == 'true'
        env:
          ANGLE: ${{ inputs.angle }}   # passed as data, never pasted into the script
        run: uv run --frozen python -m owd run --angle "$ANGLE"

      - name: Keep the footage cache small (clips unused for 30 days are dropped)
        if: always() && steps.plan.outputs.make == 'true'
        run: find .owd-cache -type f -mtime +30 -delete 2>/dev/null || true

      - name: Delete old caches and run logs (keep the newest)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # caches: keep the newest of each kind, delete the rest
          gh cache list --limit 100 --sort created_at --order desc --json id,key \
            --jq '[group_by(.key | sub("-[0-9]+$"; ""))[] | .[1:][] | .id] | .[]' |
            while read -r id; do gh cache delete "$id" || true; done
          # run logs older than 30 days
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" || true; done

      - name: Save progress (state and storyboard) to the repository
        if: always()
        run: |
          git config user.name "breme-analytics"
          git config user.email "341067996+breme-analytics@users.noreply.github.com"
          for path in state storyboards steering/references; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Bot: progress from run ${{ github.run_number }}"
            git pull --rebase --autostash
            git push
          fi

      # GitHub emails about a scheduled run only the person who first created the workflow, so a failure
      # could go unnoticed. An issue reaches the owner (GitHub emails watchers about new issues).
      - name: If this run failed, open an issue so you hear about it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/failed.md" <<EOF
          The **${GITHUB_WORKFLOW}** run of $(date -u '+%d %b %Y, %H:%M UTC') failed.

          - **What happened:** ${RUN_URL} (the reason is at the top of that page, or in the last lines of the red step).
          - **What to do:** docs/GUIDE.md, "When something goes wrong". Close this issue once it's sorted.
          EOF
          gh label create bot-problem --color D93F0B --description "The bot needs attention" --force || true
          number=$(gh issue list --label bot-problem --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/failed.md"
          else
            gh issue create --title "The bot needs attention: a run failed" --label bot-problem --body-file "$RUNNER_TEMP/failed.md" ||
              gh issue create --title "The bot needs attention: a run failed" --body-file "$RUNNER_TEMP/failed.md"
          fi
