name: cleanup

# Every day, the storage rules (owd/storage.py, channel.toml [storage]):
# - finds out what happened: issues you closed (posted, or "not planned" = discarded), and whether
#   scheduled videos really went public on YouTube (if not, their issue asks you to post the copy);
# - deletes stored copies (GitHub releases) that are due: posted more than keep_days_after_posting
#   ago, discarded, or left by a failed run; keeps the total within max_videos; and deletes any
#   stray "video-" release nothing knows about;
# - deletes old workflow caches and run logs.
# So storage never grows and nothing ever costs money.
on:
  schedule:
    - cron: "40 2 * * *"   # 02:40 UTC (05:40 Nairobi)
  workflow_dispatch:

permissions:
  contents: write   # delete releases and tags; commit state/videos.json
  issues: write     # comment on and close video issues
  actions: write    # delete old caches and run logs

concurrency:
  group: bot-state  # never at the same time as produce: both update state/videos.json
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Only used to check that scheduled videos went public (auto mode); fine to leave unset.
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - run: uv sync --frozen

      - name: Apply the storage rules
        run: uv run --frozen python -m owd cleanup

      - name: Delete old caches and run logs (keep the newest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # caches: keep the newest of each kind, delete the rest
          gh cache list --limit 100 --sort created_at --order desc --json id,key \
            --jq '[group_by(.key | sub("-[0-9]+$"; ""))[] | .[1:][] | .id] | .[]' |
            while read -r id; do gh cache delete "$id" || true; done
          # run logs older than 30 days
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" || true; done

      - name: Save progress
        if: always()
        run: |
          git config user.name "breme-analytics"
          git config user.email "341067996+breme-analytics@users.noreply.github.com"
          if [ -e state ]; then git add state; fi
          if ! git diff --cached --quiet; then
            git commit -m "Bot: cleanup"
            git pull --rebase --autostash
            git push
          fi
