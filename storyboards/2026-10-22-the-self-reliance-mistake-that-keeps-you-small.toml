[[scene]]
chapter = "The Conspiracy Against You"
visual = "fog road"
image = "A lone figure stands at a crossroads shrouded in mist, each path disappearing into darkness. The figure's silhouette is sharp against a pale sky."
text = '''
You wake up. You put on the clothes they told you to wear. You say the words they taught you to say. You nod when they nod. And somewhere, quiet and deep, a voice whispers: this isn't me. [pause] Ralph Waldo Emerson heard that voice in 1841. He called it the conspiracy.

'''

[[scene]]
visual = "book pages"
image = "An open leather-bound book lies on a wooden desk. Candlelight flickers across the pages. Ink bleeds into paper in slow, deliberate lines."
text = '''
Society everywhere is in conspiracy against the manhood of every one of its members. Society is a joint-stock company, in which the members agree, for the better securing of his bread to each shareholder, to surrender the liberty and culture of the eater. The virtue in most request is conformity. Self-reliance is its aversion.

'''

[[scene]]
visual = "mirror reflection"
image = "A cracked mirror reflects a face half in shadow, half in light. The reflection doesn't quite match the person standing before it."
text = '''
Emerson watched men wear the "foolish face of praise" — muscles tightened by a low usurping wilfulness, smiling at jokes they didn't find funny, agreeing with opinions they didn't hold. He saw the cost: scattered force, blurred character, a life lived at second hand.

'''

[[scene]]
visual = "storm clouds"
image = "Dark clouds gather over a solitary tree on a hill. Lightning illuminates the scene for a fraction of a second. The tree doesn't bend."
text = '''
For nonconformity the world whips you with its displeasure. The sour faces of the multitude have no deep cause — they're put on and off as the wind blows. And yet. [pause] The discontent of the multitude is more formidable than that of the senate. Why?

'''

[[scene]]
chapter = "The Child Who Knows"
visual = "lotus flower"
image = "A single lotus rises through dark water, petals unfolding toward a light that comes from nowhere and everywhere. No other flowers in sight."
text = '''
Emerson pointed to children. Infancy conforms to nobody; all conform to it. One babe makes four or five adults prattle and play to it. The boy in the parlour judges the world from his corner — good, bad, interesting, silly — never cumbering himself about consequences.

'''

[[scene]]
visual = "seedling soil"
image = "A pale shoot pushes through dark earth. The soil is rich, the light above is harsh. The stem is thin but unbent."
text = '''
Their mind being whole, their eye is as yet unconquered. When we look in their faces we are disconcerted. [pause] Then consciousness claps the man into jail. Once he has acted with éclat, he is committed — watched by hundreds whose affections must now enter his account. There is no Lethe for this.

'''

[[scene]]
visual = "crossroads road"
image = "Two dirt paths diverge in a wood. One is wide, worn smooth by countless feet. The other is overgrown, barely visible. No signposts."
text = '''
Who can avoid all pledges and, having observed, observe again from the same unaffected, unbiased, unaffrighted innocence? That man must always be formidable. He would utter opinions which, being seen as not private but necessary, would sink like darts into the ear of men and put them in fear.

'''

[[scene]]
visual = "candle flame"
image = "A single flame in a dark room. It doesn't illuminate everything. It illuminates what's near. The wax melts slowly, feeding the light."
text = '''
Emerson knew this state cannot last. He wrote: "The voices which we hear in solitude grow faint and inaudible as we enter into the world." A 2026 study of four hundred college students found that simple daily routines — eating breakfast, sleeping well, moving the body — were associated with greater psychological flexibility. The capacity to adapt rather than conform. The child's whole mind isn't lost. It's buried under habits we can unlearn.

'''

