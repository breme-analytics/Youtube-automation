text = '''
> To believe your own thought, to believe that what is true for you in your private heart is true for all men,—that is genius. Speak your latent conviction, and it shall be the universal sense; for the inmost in due time becomes the outmost, and our first thought is rendered back to us by the trumpets of the Last Judgment.

'''

[[scene]]
chapter = "The Hobgoblin of Little Minds"
visual = "hourglass sand"
image = "Sand flows through glass in a steady stream. Half the grains have fallen. The lower bulb forms a perfect cone. Light catches each grain."
text = '''
The other terror that scares us from self-trust is our consistency. A reverence for our past act or word because the eyes of others have no other data for computing our orbit. Why drag about this corpse of your memory, lest you contradict somewhat you have stated in some public place?

'''

[[scene]]
visual = "brain neurons"
image = "Neural pathways pulse with soft light. Some routes blaze bright and well-worn. Others are faint, tentative. A new connection flares into being."
text = '''
Suppose you should contradict yourself; what then? It seems a rule of wisdom never to rely on your memory alone, but to bring the past for judgment into the thousand-eyed present, and live ever in a new day. [pause] A foolish consistency is the hobgoblin of little minds, adored by little statesmen and philosophers and divines.

'''

[[scene]]
visual = "light particles"
image = "Specks of light rise from darkness, each one a word spoken into silence. They don't form a pattern. They don't need to."
text = '''
> A foolish consistency is the hobgoblin of little minds, adored by little statesmen and philosophers and divines. With consistency a great soul has simply nothing to do.

'''

[[scene]]
visual = "galaxy stars"
image = "A spiral galaxy rotates in deep space. Billions of stars, each following its own orbit. No centre holds them. They hold themselves."
text = '''
Pythagoras was misunderstood, and Socrates, and Jesus, and Luther, and Copernicus, and Galileo, and Newton, and every pure and wise spirit that ever took flesh. To be great is to be misunderstood. Is it so bad then to be misunderstood? Emerson's answer: the voyage of the best ship is a zigzag line of a hundred tacks. See the line from a sufficient distance, and it straightens itself to the average tendency. Your genuine action will explain itself. Your conformity explains nothing.

'''

