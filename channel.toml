# Channel settings. Change voices here; every video after that uses them.
# Voices: https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md (English ones only)

[voices]
narrator = "bm_george"   # the older British storyteller reads everything, quotes included
narrator_speed = 1.0
quote = ""               # empty: one voice only (owner's choice, 11 Oct 2026)
quote_speed = 0.95

[video]
format = "long"          # Shorts are paused (owner's choice, 11 Oct 2026)
# George reads about 140 words a minute, so 1,250-1,700 words is roughly 9-12 minutes.
min_words = 1250
max_words = 1700
captions = true          # burned-in captions at the bottom, spoken word in gold (owner's request, 12 Oct)
match_visuals = true     # a free vision model checks each clip shows what George is saying (12 Oct)
paintings = true         # when no clip fits, show an AI painting of the moment instead (12 Oct)

[schedule]
# The bot runs every morning at 06:15 Nairobi (.github/workflows/produce.yml): daily checks and clean-up,
# plus a new video on these days. Each video day costs about 1 to 2 hours of GitHub Actions minutes;
# see [actions] below and docs/GUIDE.md, "Actions minutes". Two days = about 9 videos a month.
make_days = ["Mon", "Thu"]
# Which book the next video comes from: "balanced" (the book with the fewest videos so far, so the books
# take turns; ties go to the book listed first below) or "in order" (finish each book before the next).
book_order = "balanced"
timezone = "Africa/Nairobi"
# In "auto" mode, videos go public at the next of these times.
publish_days = ["Tue", "Fri"]
publish_time = "18:00"
# "review": the bot stores the video and opens a GitHub issue with download links; you post it yourself.
# "auto":   the bot stores the video, uploads it to YouTube as private and schedules it (needs the YouTube
#           secrets, docs/DEPLOY.md step 4). If YouTube doesn't publish it, the issue asks you to post the
#           stored copy by hand instead.
mode = "auto"

[actions]
# GitHub Actions minutes this bot may use per calendar month (UTC), across all its workflows. A free
# account's 2,000 minutes a month are shared by all its private repositories (the trading bot too), so
# this is this bot's share. Before each video the bot adds up this month's minutes; if the video wouldn't
# fit, it waits for next month and opens an issue to tell you. 0 = no limit.
monthly_minutes = 1000

[storage]
# Every video is stored in the cloud before it's posted, in both modes: a GitHub release in this
# repository (free, no limit on total size or downloads; each file must be under 2 GiB, about 40
# minutes of video). Nothing piles up:
# - a posted video's copy is kept this many days (in case something went wrong on YouTube), then deleted
keep_days_after_posting = 7
# - never more than this many videos stored at once (about 550 MB each). When a new one needs room,
#   copies of posted videos are deleted first. If every stored video is still waiting to be posted,
#   the bot makes no new video until you post one, or discard it (close its issue as "not planned").
max_videos = 4

# Public-domain books the writer can use, from Project Gutenberg (plain text, saved unchanged in sources/).
# Every quote is checked word for word against the book. `chapters` (optional) limits a book to those
# chapters; remove the line to use all of them. Add a book: docs/GUIDE.md, "Adding a book".
# Listed first = used first when books are tied (see book_order above). Added 13 Oct 2026 on the owner's
# choice: The Kybalion for the next video, then Emerson's two essays, Meditations and The Way of Peace.
[[books]]
id = "the-kybalion"
file = "sources/the-kybalion.txt"
cite = "Three Initiates, The Kybalion (1908)"
author = "Three Initiates"
gutenberg = 14209

[[books]]
id = "as-a-man-thinketh"
file = "sources/as-a-man-thinketh.txt"
cite = "James Allen, As a Man Thinketh (1903)"
author = "James Allen"
gutenberg = 4507

[[books]]
id = "the-way-of-peace"
file = "sources/the-way-of-peace.txt"
cite = "James Allen, The Way of Peace (1907)"
author = "James Allen"
gutenberg = 10740

[[books]]
id = "meditations"
file = "sources/meditations.txt"
cite = "Marcus Aurelius, Meditations (translated by Meric Casaubon, 1634)"
author = "Marcus Aurelius"
gutenberg = 2680
chapters = ["FIRST BOOK", "SECOND BOOK", "THIRD BOOK", "FOURTH BOOK", "FIFTH BOOK", "SIXTH BOOK",
            "SEVENTH BOOK", "EIGHTH BOOK", "NINTH BOOK", "TENTH BOOK", "ELEVENTH BOOK", "TWELFTH BOOK"]

[[books]]
id = "emerson-essays"
file = "sources/emerson-essays-first-series.txt"
cite = "Ralph Waldo Emerson, Essays: First Series (1841)"
author = "Ralph Waldo Emerson"
gutenberg = 2944
chapters = ["SELF-RELIANCE", "THE OVER-SOUL"]   # remove this line to use all twelve essays

[llm]
# Tried in this order; on a limit or an error the next one is used. All are free tiers.
# OpenRouter's free models come first: Gemini's free tier is small (about 20 requests a day on Flash,
# more on Flash-Lite) and is also used for the vision check that matches pictures to the words.
openrouter = [
  "nvidia/nemotron-3-super-120b-a12b:free",
  "nvidia/nemotron-3-ultra-550b-a55b:free",
  "google/gemma-4-31b-it:free",
  "dots-studio/dots-3-note-preview:free",
  "google/gemma-4-26b-a4b-it:free",
]
gemini = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite"]
cloudflare = ["@cf/google/gemma-4-26b-a4b-it"]   # needs CLOUDFLARE_AI_TOKEN (Workers AI permission)

[footage]
# Visual style lives in steering/references/visual-style.md. No default category: scenes about
# the mind and spirit span backgrounds, nature, religion, science and feelings.
default_category = ""
# Searched when a scene's own footage search finds nothing usable; the vision check still decides
# whether any of these fits the words (otherwise a painting is used).
fallback = ["candle flame", "ink water", "book pages", "fog forest", "galaxy stars", "sunrise mountains", "rain window"]

[news]
# Words that make a research story relevant to this channel (matched in titles and summaries)
keywords = [
  "rumination", "worry", "habit", "belief", "mindset", "self-talk", "attention", "focus",
  "meditation", "mindfulness", "gratitude", "purpose", "meaning", "happiness", "well-being",
  "wellbeing", "optimism", "expectation", "placebo", "visualization", "imagination",
  "self-control", "willpower", "motivation", "resilience", "stress", "emotion", "awe",
  "nature", "loneliness", "kindness", "forgiveness", "boredom", "procrastination", "identity",
  "stoic", "philosophy", "spiritual", "religio", "consciousness", "dream", "memory",
]

